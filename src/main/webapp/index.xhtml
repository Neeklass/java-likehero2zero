<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Like Hero To Zero</title>
</h:head>

<h:body>
    <h:form id="mainForm" styleClass="ui-fluid">
        <p:menubar styleClass="ui-menubar-modern">
            <p:menuitem value="Home" icon="pi pi-home" outcome="index" />
            
            <!-- If NOT logged in: Login & Register -->
            <p:menuitem value="Login" icon="pi pi-sign-in" outcome="login" 
                        rendered="#{!loginSessionBean.isLoggedIn()}" />
            <p:menuitem value="Register" icon="pi pi-user-plus" outcome="register" 
                        rendered="#{!loginSessionBean.isLoggedIn()}" />
            
            <!-- If SCIENTIST: Add Data -->
            <p:menuitem value="Add Data" icon="pi pi-plus" outcome="add_data" 
                        rendered="#{loginSessionBean.isScientist()}" />
            
            <!-- If EDITOR: Approval -->
            <p:menuitem value="Approval" icon="pi pi-check" outcome="review" 
                        rendered="#{loginSessionBean.isEditor()}" />
            
            <!-- Wenn eingeloggt: Username und Logout -->
            <f:facet name="options">
                <h:panelGroup rendered="#{loginSessionBean.isLoggedIn()}">
                    <h:outputText value="#{loginSessionBean.user.username}" 
                                  style="margin-right: 10px; font-weight: bold;" />
                    <p:commandButton value="Logout" icon="pi pi-sign-out" 
                                     action="#{loginBean.logout}" 
                                     styleClass="ui-button-secondary" />
                </h:panelGroup>
            </f:facet>
        </p:menubar>
        
        <p:outputPanel style="max-width: 800px; margin: 30px auto; padding: 20px;">
            <p:card>
                <f:facet name="title">
                    Like Hero To Zero
                </f:facet>
                <f:facet name="subtitle">
                    View the latest CO2 emission data by country
                </f:facet>
                
                <h:panelGrid columns="2" cellpadding="10" styleClass="ui-fluid" style="width: 100%; margin-bottom: 20px;">
                    <p:outputLabel for="countrySelect" value="Select country:" />
                    <p:selectOneMenu id="countrySelect" value="#{publicDataBean.selectedCountryId}">
                        <f:selectItem itemLabel="Please select..." itemValue="" />
                        <f:selectItems value="#{publicDataBean.allCountries}" var="c" 
                                       itemLabel="#{c.name}" itemValue="#{c.countryId}" />
                        <p:ajax listener="#{publicDataBean.updateSelectedData}" update="dataDisplay" />
                    </p:selectOneMenu>
                </h:panelGrid>

                <p:divider />

                <h:panelGroup id="dataDisplay">
                    <p:panel header="Emission Data" rendered="#{not empty publicDataBean.latestData}" 
                             styleClass="ui-panel-modern" style="margin-top: 20px;">
                        <h:panelGrid columns="2" cellpadding="10" style="width: 100%;">
                            <h:outputText value="Year:" style="font-weight: bold;" />
                            <h:outputText value="#{publicDataBean.latestData.year}" />

                            <h:outputText value="CO2 Emissions (kt):" style="font-weight: bold;" />
                            <h:outputText value="#{publicDataBean.latestData.co2Value}">
                                <f:convertNumber pattern="#,##0.000" />
                            </h:outputText>
                        </h:panelGrid>
                    </p:panel>
                    
                    <p:panel header="No Data Available" rendered="#{empty publicDataBean.latestData and not empty publicDataBean.selectedCountryId}" 
                             styleClass="ui-panel-modern" style="margin-top: 20px;">
                        <p:messages severity="info" closable="false">
                            <p:message severity="info" summary="No approved data available for this country." />
                        </p:messages>
                    </p:panel>
                </h:panelGroup>
            </p:card>
        </p:outputPanel>
    </h:form>
</h:body>
</html>
