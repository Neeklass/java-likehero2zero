<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>User Registration - Hero To Zero</title>
</h:head>

<h:body>
    <h:form id="registerForm">
        <p:messages id="messages" showDetail="true" closable="true" />
        
        <p:card style="width: 600px; margin: 50px auto;">
            <f:facet name="title">
                User Registration
            </f:facet>
            <f:facet name="subtitle">
                Register as an Environmental Scientist or Editor
            </f:facet>
            
            <h:panelGrid columns="2" cellpadding="10" style="width: 100%;">
                
                <p:outputLabel for="username" value="Username:" />
                <p:inputText id="username" 
                             value="#{registerBean.user.username}" 
                             required="true" 
                             requiredMessage="Username is required"
                             style="width: 100%;" />
                
                <p:outputLabel for="password" value="Password:" />
                <p:password id="password" 
                            value="#{registerBean.user.passwordHash}" 
                            required="true" 
                            requiredMessage="Password is required"
                            feedback="true"
                            weakLabel="Weak"
                            goodLabel="Good"
                            strongLabel="Strong"
                            style="width: 100%;" />
                
                <p:outputLabel for="firstname" value="First Name:" />
                <p:inputText id="firstname" 
                             value="#{registerBean.user.firstname}" 
                             style="width: 100%;" />
                
                <p:outputLabel for="lastname" value="Last Name:" />
                <p:inputText id="lastname" 
                             value="#{registerBean.user.lastname}" 
                             style="width: 100%;" />
                
                <p:outputLabel for="role" value="Role:" />
                <p:selectOneMenu id="role" 
                                 value="#{registerBean.user.role}" 
                                 required="true"
                                 requiredMessage="Please select a role"
                                 style="width: 100%;">
                    <f:selectItem itemLabel="-- Please select --" itemValue="#{null}" noSelectionOption="true" />
                    <f:selectItem itemLabel="Environmental Scientist" itemValue="SCIENTIST" />
                    <f:selectItem itemLabel="Editor" itemValue="EDITOR" />
                </p:selectOneMenu>
                
                <p:outputLabel for="country" value="Country:" />
                <p:selectOneMenu id="country" 
                                 value="#{registerBean.selectedCountryId}" 
                                 required="true"
                                 requiredMessage="Please select a country"
                                 style="width: 100%;">
                    <f:selectItem itemLabel="-- Please select --" itemValue="#{null}" noSelectionOption="true" />
                    <f:selectItems value="#{registerBean.allCountries}" 
                                   var="country" 
                                   itemLabel="#{country.name}" 
                                   itemValue="#{country.countryId}" />
                </p:selectOneMenu>
                
            </h:panelGrid>
            
            <f:facet name="footer">
                <p:commandButton value="Register" 
                                 action="#{registerBean.register}" 
                                 update="@form"
                                 icon="pi pi-user-plus"
                                 styleClass="ui-button-success" />
                
                <p:button value="Back" 
                          outcome="index" 
                          icon="pi pi-arrow-left"
                          styleClass="ui-button-secondary" 
                          style="margin-left: 10px;" />
            </f:facet>
        </p:card>
    </h:form>
</h:body>
</html>
